<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portfólio de Serviços · GTIC</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0d1a2e;--ink2:#2c3e55;--ink3:#5a6b7e;
  --paper:#f7f5f0;--paper2:#ede9e1;--rule:#d4cfc5;
  --blue:#1a4f8a;--blue-lt:#e8f0fa;--blue-mid:#2d6fbd;
  --amber:#b07d1a;--amber-lt:#fdf3dc;--amber-mid:#c8a94a;
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.6}

.hero{background:var(--ink);color:#fff;padding:32px 60px 28px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 80% 50%,rgba(45,111,189,.18) 0%,transparent 70%)}
.hero-inner{position:relative;max-width:1280px;margin:0 auto}
.hero h1{font-family:'DM Serif Display',serif;font-size:clamp(22px,3vw,36px);color:#fff;line-height:1.1;margin-bottom:4px}
.hero h1 em{color:var(--amber-mid);font-style:normal}
.hero p{font-size:12.5px;color:rgba(255,255,255,.45)}

.main{max-width:1280px;margin:0 auto;padding:28px 60px 60px}

.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:24px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:220px}
.search-wrap input{width:100%;padding:10px 16px 10px 38px;border:1.5px solid var(--rule);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink);background:#fff;outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--blue-mid)}
.search-wrap::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}
.results-count{font-size:11px;color:var(--ink3)}

.portfolio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.portfolio-card{background:#fff;border:1px solid var(--rule);border-radius:14px;overflow:hidden;transition:all .2s;display:flex;flex-direction:column}
.portfolio-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-2px)}
.pc-top{padding:20px 22px 16px;flex:1}
.pc-name{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px;line-height:1.35}
.pc-desc{font-size:12px;color:var(--ink3);line-height:1.55;margin-bottom:14px}
.pc-meta{display:flex;flex-direction:column;gap:5px}
.pc-meta-row{display:flex;gap:10px;font-size:11.5px}
.pc-meta-label{color:var(--ink3);font-weight:600;min-width:82px;flex-shrink:0}
.pc-meta-value{color:var(--ink2);line-height:1.4}
.pc-footer{padding:12px 22px;border-top:1px solid var(--rule);background:var(--paper2);display:flex;align-items:center;justify-content:space-between;gap:8px}
.pc-link{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--blue-lt);color:var(--blue-mid);border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;transition:background .15s}
.pc-link:hover{background:#d0e4f7}
.pc-no-link{font-size:11px;color:var(--ink3);font-style:italic}

.page-footer{padding:0 60px;background:var(--ink)}
.footer-top{max-width:1280px;margin:0 auto;padding:22px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid rgba(255,255,255,.08)}
.footer-brand{font-family:'DM Serif Display',serif;font-size:16px;color:#fff}
.footer-info{font-size:11.5px;color:rgba(255,255,255,.35)}
.footer-bottom{max-width:1280px;margin:0 auto;padding:14px 0;display:flex;align-items:center;justify-content:space-between}
.footer-logo{height:36px;object-fit:contain;object-position:left}
.footer-copy{font-size:11px;color:rgba(255,255,255,.2)}

@media(max-width:900px){
  .hero,.main,.page-footer{padding-left:16px;padding-right:16px}
  .portfolio-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <h1>Portfólio de <em>Serviços</em></h1>
    <p>GTIC — Gerência de Tecnologia da Informação e Comunicação · Secretaria de Saúde do Recife</p>
  </div>
</header>

<div class="main">
  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Buscar sistema, fornecedor ou executiva..." oninput="filter()">
    </div>
    <span class="results-count" id="countEl"></span>
  </div>
  <div class="portfolio-grid" id="grid"></div>
</div>

<footer class="page-footer">

SERMARC"}, {"servico": "GLPI", "descricao": "Um sistema para controlar as solicitações de abertura de chamado técnico é essencial para a gestão eficiente do suporte técnico, permitindo a organização e o acompanhamento das demandas de atendimento. Este tipo de sistema ajuda as equipes a gerenciar problemas e solicitações de forma sistemática, garantindo que as questões sejam tratadas de maneira oportuna e eficaz.", "link": "https://ggti.recife.pe.gov.br/glpi/", "contato": "SAÚDE DIGITAL ATENDE Tel: 55 81 9117-1407", "hospedagem": "EMPREL", "fornecedor": "INDRA", "executiva": "NÍVEL CENTRAL"}, {"servico": "HOPCHAT", "descricao": "Um sistema de comunicação que centraliza e disponibiliza um meio eficiente de interação entre uma organização e seus usuários finais é essencial para garantir um atendimento ágil e eficaz. Este tipo de sistema pode assumir várias formas, como uma plataforma de help desk, um sistema de gestão de relacionamento com o cliente (CRM), ou uma solução de comunicação unificada.", "link": "https://chat-conecta.recife.pe.gov.br/home", "contato": "SAÚDE DIGITAL ATENDE Tel: 55 81 9117-1407", "hospedagem": "EMPREL", "fornecedor": "INDRA", "executiva": "EMPREL"}, {"servico": "HORAS DA SAÚDE DIGITAL (HOP CHAT)", "descricao": "Um painel de monitoramento do trabalho em saúde digital é uma ferramenta essencial para visualizar, acompanhar e analisar indicadores e dados relacionados às atividades e desempenho de iniciativas de saúde digital. Esse painel proporciona uma visão integrada e em tempo real sobre as operações de saúde digital, facilitando a tomada de decisões informadas.", "link": "https://datahub.recife.pe.gov.br/relatorio-peab", "contato": "SAÚDE DIGITAL ATENDE Tel: 55 81 9117-1407", "hospedagem": "EMPREL", "fornecedor": "EMPREL", "executiva": "SEGTES"}, {"servico": "HORAS DE SAÚDE DIGITAL - TELE INTERCONSULTA (TELESAÚDE)", "descricao": "Sistema que computa o horas da Telesaúde através do Meet", "link": "Google Meet", "contato": "SAÚDE DIGITAL ATENDE function toSentence(str) {
  if (!str) return '';
  return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
}

function render(rows) {
  let html = '';
  rows.forEach(r => {
    const nome = r.servico.replace(/\n/g,' ').trim();
    const desc = r.descricao.replace(/\n/g,' ').trim();
    const link = r.link && r.link.trim().startsWith('http') ? r.link.trim() : '';
    const contato = r.contato ? r.contato.replace(/\n/g,' ') : '';
    html += `<div class="portfolio-card">
      <div class="pc-top">
        <div class="pc-name">${nome}</div>
        ${desc ? `<div class="pc-desc">${toSentence(desc)}</div>` : ''}
        <div class="pc-meta">
          ${r.fornecedor ? `<div class="pc-meta-row"><span class="pc-meta-label">Fornecedor</span><span class="pc-meta-value">${r.fornecedor}</span></div>` : ''}
          ${r.executiva  ? `<div class="pc-meta-row"><span class="pc-meta-label">Executiva</span><span class="pc-meta-value">${r.executiva}</span></div>` : ''}
          ${r.hospedagem ? `<div class="pc-meta-row"><span class="pc-meta-label">Hospedagem</span><span class="pc-meta-value">${r.hospedagem}</span></div>` : ''}
          ${contato      ? `<div class="pc-meta-row"><span class="pc-meta-label">Contato</span><span class="pc-meta-value">${contato}</span></div>` : ''}
        </div>
      </div>
      <div class="pc-footer">
        ${link ? `<a href="${link}" target="_blank" class="pc-link">🔗 Acessar sistema</a>` : `<span class="pc-no-link">Link não disponível</span>`}
      </div>
    </div>`;
  });
  document.getElementById('grid').innerHTML = html || '<div style="padding:40px;text-align:center;color:var(--ink3)">Nenhum resultado.</div>';
  document.getElementById('countEl').textContent = rows.length + ' serviço(s)';
}

function filter() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const filtered = q ? DATA.filter(r =>
    (r.servico+r.descricao+r.fornecedor+r.executiva+r.contato).toLowerCase().includes(q)
  ) : DATA;
  render(filtered);
}

render(DATA);
</script>
</body>
</html>
