
name: Atualizar Indicadores GLPI 2026

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-indicadores-glpi-2026
  cancel-in-progress: false

jobs:
  preparar-atualizacao:
    name: Validar e publicar indicadores
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter arquivos do repositorio
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Verificar secrets obrigatorios
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
        run: |
          test -n "$N8N_WEBHOOK_URL" || {
            echo "ERRO: N8N_WEBHOOK_URL nao configurado"
            exit 1
          }

          test -n "$N8N_WEBHOOK_TOKEN" || {
            echo "ERRO: N8N_WEBHOOK_TOKEN nao configurado"
            exit 1
          }

          echo "Secrets configurados."

      - name: Chamar Webhook do n8n
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 300 \
            --request POST \
            --header "X-GTIC-Atualizacao: ${N8N_WEBHOOK_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"origem":"github-actions","acao":"atualizar-indicadores-2026"}' \
            --output resposta-n8n.json \
            "$N8N_WEBHOOK_URL"

          echo "Webhook respondeu com sucesso."

      - name: Validar indicadores com Python
        run: |
          python3 .github/scripts/validar_indicadores_2026.py resposta-n8n.json

      - name: Publicar indicadores validados
        run: |
          mkdir -p dados

          python3 - <<'PY'
          import json
          from pathlib import Path

          origem = Path("resposta-n8n.json")
          destino = Path("dados/indicadores_glpi_2026.json")

          dados = json.loads(origem.read_text(encoding="utf-8"))

          if isinstance(dados, list) and len(dados) == 1:
              dados = dados[0]

          destino.write_text(
              json.dumps(dados, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("JSON validado preparado para publicacao.")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dados/indicadores_glpi_2026.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nos indicadores."
          else
            git commit -m "Atualizar indicadores GLPI validados"
            git push origin HEAD:main
          fi

      - name: Confirmar publicacao
        run: |
          echo "Indicadores GLPI validados e publicados."
          echo "Arquivo: dados/indicadores_glpi_2026.json"
          echo "Dados historicos do painel preservados."


