

name: Atualizar Indicadores GLPI 2026

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar-atualizacao:
    name: Testar conexao e validar indicadores
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter arquivos do repositorio
        uses: actions/checkout@v5

      - name: Verificar secrets obrigatorios
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
        run: |
          test -n "$N8N_WEBHOOK_URL" || {
            echo "ERRO: N8N_WEBHOOK_URL nao configurado"
            exit 1
          }

          test -n "$N8N_WEBHOOK_TOKEN" || {
            echo "ERRO: N8N_WEBHOOK_TOKEN nao configurado"
            exit 1
          }

          echo "Secrets configurados."

      - name: Chamar Webhook do n8n
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 300 \
            --request POST \
            --header "X-GTIC-Atualizacao: ${N8N_WEBHOOK_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"origem":"github-actions","acao":"atualizar-indicadores-2026"}' \
            --output resposta-n8n.json \
            "$N8N_WEBHOOK_URL"

          echo "Webhook respondeu com sucesso."

      - name: Validar indicadores com Python
        run: |
          python3 .github/scripts/validar_indicadores_2026.py resposta-n8n.json

      - name: Confirmar validacao
        run: |
          echo "Indicadores do GLPI validados com sucesso."
          echo "Publicacao no GitHub continua desabilitada."

